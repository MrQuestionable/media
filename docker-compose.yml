services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyglot-media-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/mediadb
    depends_on:
      db:
        condition: service_healthy   

  db:
    image: postgres:15-alpine
    container_name: polyglot-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mediadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                    
      test: ["CMD-SHELL", "pg_isready -U admin -d mediadb"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata: